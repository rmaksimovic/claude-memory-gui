<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Memory GUI</title>
  <link rel="icon" type="image/png" href="claude-code-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Header -->
<header>
  <h1>Claude Memory GUI</h1>
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Search claude files..." autocomplete="off" />
    <select id="type-filter">
      <option value="">All</option>
      <option value="claude_md">md file</option>
      <option value="memory">memory</option>
      <option value="chat">chat</option>
    </select>
  </div>
  <div id="status-dot" title="Live sync active"></div>
</header>

<!-- Search results overlay -->
<div id="search-results"></div>

<!-- Main layout -->
<div class="layout">

  <!-- Sidebar with tabs -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" id="tab-memory" onclick="switchTab('memory')">Projects</div>
      <div class="sidebar-tab" id="tab-commands" onclick="switchTab('commands')">Commands</div>
      <div class="sidebar-tab" id="tab-mcp" onclick="switchTab('mcp')">MCP</div>
    </div>

    <!-- Projects list (memory tab) -->
    <div class="sidebar-section" id="section-memory">
      <!-- Content type filter bar -->
      <div class="filter-bar">
        <button class="filter-item active" id="fp-memory" onclick="toggleFilter('memory')"><span class="filter-dot"></span>Memory</button>
        <button class="filter-item active" id="fp-claudemd" onclick="toggleFilter('claudemd')"><span class="filter-dot"></span>MD files</button>
        <button class="filter-item active" id="fp-conversations" onclick="toggleFilter('conversations')"><span class="filter-dot"></span>Chats</button>
      </div>
      <div class="sidebar-header-row">
        <div class="sidebar-title">Projects</div>
        <button class="toggle-empty on" id="toggle-empty-btn" onclick="toggleShowEmpty()">hide empty</button>
      </div>
      <div id="project-list"></div>
      <div class="tree-footer" id="tree-footer"></div>
    </div>

    <!-- Commands list (commands tab) -->
    <div class="sidebar-section hidden" id="section-commands">
      <div class="sidebar-title">Custom Commands</div>
      <div id="command-sidebar-list"></div>
    </div>

    <!-- MCP servers (mcp tab) -->
    <div class="sidebar-section hidden" id="section-mcp">
      <div class="sidebar-title">MCP Servers</div>
      <div id="mcp-sidebar-list"></div>
    </div>
  </div>

  <div class="resize-handle" data-col="sidebar"><div class="resize-grip"></div></div>

  <!-- Middle: file list OR command list -->
  <div class="file-list-col">
    <div class="file-search-row" id="file-search-row">
      <span class="file-search-icon">⌕</span>
      <input type="text" class="file-search-input" id="file-search-input" placeholder="Search files…" />
    </div>
    <div class="file-list-header" id="file-list-header"></div>
    <div class="file-list" id="file-list">
      <div class="empty">Select a project</div>
    </div>
    <div class="file-list-footer" id="file-list-footer"></div>
  </div>

  <div class="resize-handle" data-col="filelist"><div class="resize-grip"></div></div>

  <!-- Editor pane -->
  <div class="editor-pane" id="editor-pane">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="editor-content" id="editor-content">
      <div class="empty">Select a file to view</div>
    </div>
  </div>

  <div class="resize-handle" data-col="stats" id="stats-resize-handle" style="display:none"><div class="resize-grip"></div></div>

  <!-- Conversation stats panel (right side, only shown for chat files) -->
  <div class="conv-stats-panel" id="conv-stats-panel"></div>

</div>

<!-- New memory modal -->
<div class="modal-overlay" id="new-file-modal" style="display:none">
  <div class="modal">
    <h2>New Memory File</h2>
    <div class="field">
      <label>Filename (without .md)</label>
      <input id="nf-filename" type="text" placeholder="e.g. feedback_testing" />
    </div>
    <div class="field">
      <label>Name</label>
      <input id="nf-name" type="text" placeholder="Short descriptive name" />
    </div>
    <div class="field">
      <label>Description</label>
      <input id="nf-desc" type="text" placeholder="One-line description" />
    </div>
    <div class="field">
      <label>Type</label>
      <select id="nf-type">
        <option value="user">user</option>
        <option value="feedback">feedback</option>
        <option value="project">project</option>
        <option value="reference">reference</option>
      </select>
    </div>
    <div class="field">
      <label>Body</label>
      <textarea id="nf-body" rows="4" placeholder="Memory content…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nf-cancel">Cancel</button>
      <button class="btn" id="nf-create">Create</button>
    </div>
  </div>
</div>

<!-- New command modal -->
<div class="modal-overlay" id="new-command-modal" style="display:none">
  <div class="modal">
    <h2>New Command</h2>
    <div class="field">
      <label>Command name (used as /name in Claude Code)</label>
      <input id="nc-name" type="text" placeholder="e.g. my-task" />
    </div>
    <div class="field">
      <label>Instructions (what Claude should do when invoked)</label>
      <textarea id="nc-body" rows="6" placeholder="Describe what this command should do…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nc-cancel">Cancel</button>
      <button class="btn" id="nc-create">Create</button>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/resize.js"></script>
<script src="js/stats.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/tabs.js"></script>
<script src="js/projects.js"></script>
<script src="js/files.js"></script>
<script src="js/editor.js"></script>
<script src="js/commands.js"></script>
<script src="js/mcp.js"></script>
<script src="js/conversations.js"></script>
<script src="js/modals.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
