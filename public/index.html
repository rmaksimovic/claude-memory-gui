<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Memory GUI</title>
  <link rel="icon" type="image/png" href="claude-code-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Header -->
<header>
  <!-- Brand — aligned with sidebar width -->
  <div class="header-brand">
    <div class="sidebar-brand-icon">
      <span class="material-symbols-outlined">memory</span>
    </div>
    <div class="sidebar-brand-text">
      <div class="sidebar-brand-title">Claude Memory</div>
      <div class="sidebar-brand-sub">File System</div>
    </div>
  </div>
  <!-- Search — centered in remaining space -->
  <div id="search-bar">
    <span class="material-symbols-outlined search-icon">search</span>
    <input id="search-input" type="text" placeholder="Search files…" autocomplete="off" />
    <select id="type-filter">
      <option value="">All</option>
      <option value="claude_md">md file</option>
      <option value="memory">memory</option>
      <option value="chat">chat</option>
    </select>
  </div>
  <!-- Actions -->
  <div class="header-actions">
    <div id="status-dot" title="Live sync active"></div>
  </div>
</header>

<!-- Search results overlay -->
<div id="search-results"></div>

<!-- Main layout -->
<div class="layout">

  <!-- Sidebar with tabs -->
  <div class="sidebar">

    <!-- Nav tabs as icon rows -->
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" id="tab-memory" onclick="switchTab('memory')">
        <span class="material-symbols-outlined sidebar-tab-icon">folder</span>Projects
      </div>
      <div class="sidebar-tab" id="tab-bookmarks" onclick="switchTab('bookmarks')">
        <span class="material-symbols-outlined sidebar-tab-icon">bookmark</span>Bookmarks
      </div>
      <div class="sidebar-tab" id="tab-commands" onclick="switchTab('commands')">
        <span class="material-symbols-outlined sidebar-tab-icon">terminal</span>Skills
      </div>
      <div class="sidebar-tab" id="tab-mcp" onclick="switchTab('mcp')">
        <span class="material-symbols-outlined sidebar-tab-icon">hub</span>MCP
      </div>
    </div>

    <!-- Projects list (memory tab) -->
    <div class="sidebar-section" id="section-memory">

      <!-- Pinned card (hidden when no bookmarks) -->
      <div class="sidebar-card" id="pinned-card">
        <div class="sidebar-card-header" onclick="togglePinnedCollapsed()">
          <span class="material-symbols-outlined sidebar-card-icon">bookmark</span>
          <span class="sidebar-card-title">Pinned</span>
          <span class="material-symbols-outlined sidebar-card-chevron">expand_less</span>
        </div>
        <div class="sidebar-card-body" id="pinned-list"></div>
      </div>

      <!-- Directories card -->
      <div class="sidebar-card" id="dirs-card">
        <div class="sidebar-card-header" onclick="toggleDirsCollapsed()">
          <span class="material-symbols-outlined sidebar-card-icon">folder</span>
          <span class="sidebar-card-title">Directories</span>
          <span class="material-symbols-outlined sidebar-card-chevron">expand_less</span>
        </div>
        <div class="sidebar-card-body" id="project-list"></div>
      </div>

      <!-- File type filters card -->
      <div class="sidebar-card" id="filter-section">
        <div class="sidebar-card-header" onclick="toggleFiltersCollapsed()">
          <span class="material-symbols-outlined sidebar-card-icon">tune</span>
          <span class="sidebar-card-title">File Type Filters</span>
          <span class="material-symbols-outlined sidebar-card-chevron filter-chevron">expand_less</span>
        </div>
        <div class="sidebar-card-body filter-bar" id="filter-bar-body">
          <button class="filter-item active" id="fp-memory" onclick="toggleFilter('memory')">
            <span class="filter-label">Memory</span>
            <span class="filter-switch"><span class="filter-knob"></span></span>
          </button>
          <button class="filter-item active" id="fp-claudemd" onclick="toggleFilter('claudemd')">
            <span class="filter-label">MD Files</span>
            <span class="filter-switch"><span class="filter-knob"></span></span>
          </button>
          <button class="filter-item active" id="fp-conversations" onclick="toggleFilter('conversations')">
            <span class="filter-label">Conversations</span>
            <span class="filter-switch"><span class="filter-knob"></span></span>
          </button>
          <div class="filter-divider"></div>
          <button class="filter-item" id="toggle-empty-btn" onclick="toggleShowEmpty()">
            <span class="filter-label">Hide empty dirs</span>
            <span class="filter-switch"><span class="filter-knob"></span></span>
          </button>
        </div>
      </div>

      <div class="tree-footer" id="tree-footer"></div>
    </div>

    <!-- Bookmarks list (bookmarks tab) -->
    <div class="sidebar-section hidden" id="section-bookmarks">
      <div class="sidebar-title">Bookmarked Files</div>
      <div id="bookmarks-sidebar-list"></div>
    </div>

    <!-- Skills list (commands tab) -->
    <div class="sidebar-section hidden" id="section-commands">
      <div class="sidebar-title">Skills</div>
      <div id="command-sidebar-list"></div>
    </div>

    <!-- MCP servers (mcp tab) -->
    <div class="sidebar-section hidden" id="section-mcp">
      <div class="sidebar-title">MCP Servers</div>
      <div id="mcp-sidebar-list"></div>
    </div>
  </div>

  <div class="resize-handle" data-col="sidebar"><div class="resize-grip"></div></div>

  <!-- Middle: file list OR command list -->
  <div class="file-list-col">
    <div class="file-search-row" id="file-search-row">
      <span class="file-search-icon">⌕</span>
      <input type="text" class="file-search-input" id="file-search-input" placeholder="Search files…" />
    </div>
    <div class="file-list-header" id="file-list-header"></div>
    <div class="file-list" id="file-list">
      <div class="empty">Select a project</div>
    </div>
    <div class="file-list-footer" id="file-list-footer"></div>
  </div>

  <div class="resize-handle" data-col="filelist"><div class="resize-grip"></div></div>

  <!-- Editor pane -->
  <div class="editor-pane" id="editor-pane">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="editor-content" id="editor-content">
      <div class="empty">Select a file to view</div>
    </div>
  </div>

  <div class="resize-handle" data-col="stats" id="stats-resize-handle" style="display:none"><div class="resize-grip"></div></div>

  <!-- Conversation stats panel (right side, only shown for chat files) -->
  <div class="conv-stats-panel" id="conv-stats-panel"></div>

</div>

<!-- New memory modal -->
<div class="modal-overlay" id="new-file-modal" style="display:none">
  <div class="modal">
    <h2>New Memory File</h2>
    <div class="field">
      <label>Filename (without .md)</label>
      <input id="nf-filename" type="text" placeholder="e.g. feedback_testing" />
    </div>
    <div class="field">
      <label>Name</label>
      <input id="nf-name" type="text" placeholder="Short descriptive name" />
    </div>
    <div class="field">
      <label>Description</label>
      <input id="nf-desc" type="text" placeholder="One-line description" />
    </div>
    <div class="field">
      <label>Type</label>
      <select id="nf-type">
        <option value="user">user</option>
        <option value="feedback">feedback</option>
        <option value="project">project</option>
        <option value="reference">reference</option>
      </select>
    </div>
    <div class="field">
      <label>Body</label>
      <textarea id="nf-body" rows="4" placeholder="Memory content…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nf-cancel">Cancel</button>
      <button class="btn" id="nf-create">Create</button>
    </div>
  </div>
</div>

<!-- New skill modal -->
<div class="modal-overlay" id="new-command-modal" style="display:none">
  <div class="modal">
    <h2>New Skill</h2>
    <div class="field">
      <label>Skill name (used as /name in Claude Code)</label>
      <input id="nc-name" type="text" placeholder="e.g. my-task" />
    </div>
    <div class="field">
      <label>Instructions (what Claude should do when invoked)</label>
      <textarea id="nc-body" rows="6" placeholder="Describe what this skill should do…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nc-cancel">Cancel</button>
      <button class="btn" id="nc-create">Create</button>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/resize.js"></script>
<script src="js/stats.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/tabs.js"></script>
<script src="js/projects.js"></script>
<script src="js/files.js"></script>
<script src="js/editor.js"></script>
<script src="js/commands.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/mcp.js"></script>
<script src="js/conversations.js"></script>
<script src="js/modals.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
