      <div class="command-detail-name">/${escHtml(cmd.name)}</div>
      <div class="command-detail-scope">${escHtml(cmd.scopeLabel)} · ${escHtml(cmd.filePath)}</div>
      <div class="command-detail-desc">${escHtml(cmd.description)}</div>
    `;
    item.onclick = () => openFile(cmd.filePath, cmd.name + '.md');
    el.appendChild(item);
  }
}

// ── Editor mode: 'preview' | 'edit' ───────────────────────────────────────
let editorMode = 'preview';
let activeFileContent = '';

// ── Open file ──────────────────────────────────────────────────────────────
async function openFile(filePath, filename) {
  if (modified && activeFilePath) {
    if (!confirm('You have unsaved changes. Discard?')) return;
  }
  activeFilePath = filePath;
  modified = false;

  hideConvStatsPanel();
  const { content } = await api('GET', `/api/file?path=${encodeURIComponent(filePath)}`);
  activeFileContent = content;
  renderEditor(filePath, filename, content);

  if (currentTab === 'commands') {
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

// ── Render editor ──────────────────────────────────────────────────────────
function renderEditor(filePath, filename, content) {
  const pane = document.getElementById('editor-pane');
  pane.innerHTML = '';

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'editor-toolbar';

  const fnEl = document.createElement('div');
  fnEl.className = 'editor-filename';
  fnEl.id = 'editor-filename';
  fnEl.textContent = filePath;

  // Mode toggle
  const toggle = document.createElement('div');
  toggle.className = 'mode-toggle';
  const previewBtn = document.createElement('button');
  previewBtn.className = 'mode-btn' + (editorMode === 'preview' ? ' active' : '');
  previewBtn.textContent = 'Preview';
  previewBtn.onclick = () => setEditorMode('preview', filePath, filename);
  const editBtn = document.createElement('button');
  editBtn.className = 'mode-btn' + (editorMode === 'edit' ? ' active' : '');
  editBtn.textContent = 'Edit';
  editBtn.onclick = () => setEditorMode('edit', filePath, filename);
  toggle.appendChild(previewBtn);
  toggle.appendChild(editBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-danger';
  delBtn.textContent = 'Delete';
  delBtn.onclick = () => deleteFile(filePath);

  toolbar.appendChild(fnEl);
  toolbar.appendChild(toggle);
  if (editorMode === 'edit') {
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn';
    saveBtn.textContent = 'Save';
    saveBtn.id = 'save-btn';
    saveBtn.onclick = () => saveFile();
    toolbar.appendChild(saveBtn);
  }
  toolbar.appendChild(delBtn);
  pane.appendChild(toolbar);

  if (editorMode === 'preview') {
    renderPreview(pane, content);
  } else {
    renderTextarea(pane, content);
  }
}

function setEditorMode(mode, filePath, filename) {
  // If switching away from edit, capture current textarea content
  if (editorMode === 'edit' && mode === 'preview') {
    const ta = document.querySelector('textarea');
    if (ta) activeFileContent = ta.value;
  }
  editorMode = mode;
  renderEditor(filePath, filename, activeFileContent);
}

// ── Preview renderer ───────────────────────────────────────────────────────
function renderPreview(pane, content) {
  const scroll = document.createElement('div');
  scroll.className = 'md-preview-scroll';

  const div = document.createElement('div');
  div.className = 'md-preview';

  // Extract and render frontmatter separately
  const fmMatch = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (fmMatch) {
    const fmBlock = document.createElement('div');
    fmBlock.className = 'md-frontmatter';
    for (const line of fmMatch[1].split('\n')) {
      const idx = line.indexOf(':');
      if (idx === -1) continue;
      const key = line.slice(0, idx).trim();
      const val = line.slice(idx + 1).trim();
      const row = document.createElement('div');
      row.className = 'md-frontmatter-row';
      row.innerHTML = `<span class="md-frontmatter-key">${escHtml(key)}</span><span class="md-frontmatter-val">${escHtml(val)}</span>`;
      fmBlock.appendChild(row);
    }
    div.appendChild(fmBlock);
    div.innerHTML += marked.parse(fmMatch[2]);
  } else {
    div.innerHTML = marked.parse(content);
  }

  scroll.appendChild(div);
  pane.appendChild(scroll);
}

// ── Textarea editor ────────────────────────────────────────────────────────
function renderTextarea(pane, content) {
  const ta = document.createElement('textarea');
  ta.value = content;
  ta.spellcheck = false;
  ta.oninput = () => {
    modified = true;
    activeFileContent = ta.value;
    document.getElementById('editor-filename').classList.add('modified');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveFile, 2000);
  };
  ta.onkeydown = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      saveFile();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  };
  pane.appendChild(ta);
  ta.focus();
}

// ── Save ───────────────────────────────────────────────────────────────────
async function saveFile() {
  if (!activeFilePath) return;
  clearTimeout(saveTimeout);
  // Capture latest textarea value if in edit mode
  const ta = document.querySelector('textarea');
  if (ta) activeFileContent = ta.value;
  await api('PUT', '/api/file', { filePath: activeFilePath, content: activeFileContent });
  modified = false;
  document.getElementById('editor-filename')?.classList.remove('modified');

  if (currentTab === 'memory' && activeProjectId) {
    await selectProject(activeProjectId);
    projects = await api('GET', '/api/projects');
    renderProjects();
  } else if (currentTab === 'commands') {
    commands = await api('GET', '/api/commands');
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

// ── Delete ─────────────────────────────────────────────────────────────────
async function deleteFile(filePath) {
  if (!confirm(`Delete ${filePath.split('/').pop()}?`)) return;
  await api('DELETE', '/api/file', { filePath });
  activeFilePath = null;
  modified = false;
  document.getElementById('editor-pane').innerHTML = '<div class="empty">${ICON_FILE}Select a file to edit</div>';

  if (currentTab === 'memory' && activeProjectId) {
    await selectProject(activeProjectId);
  } else if (currentTab === 'commands') {
    commands = await api('GET', '/api/commands');
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

// ── New memory modal ───────────────────────────────────────────────────────
function openNewFileModal() {
  document.getElementById('new-file-modal').style.display = 'flex';
  document.getElementById('nf-filename').focus();
}
document.getElementById('nf-cancel').onclick = () => {
  document.getElementById('new-file-modal').style.display = 'none';
};
document.getElementById('nf-create').onclick = async () => {
  const filename = document.getElementById('nf-filename').value.trim();
  const name = document.getElementById('nf-name').value.trim();
  const desc = document.getElementById('nf-desc').value.trim();
  const type = document.getElementById('nf-type').value;
  const body = document.getElementById('nf-body').value.trim();
  if (!filename || !name) { alert('Filename and name are required.'); return; }
  const content = `---\nname: ${name}\ndescription: ${desc}\ntype: ${type}\n---\n\n${body}\n`;
  await api('POST', `/api/projects/${activeProjectId}/memories`, { filename, content });
  document.getElementById('new-file-modal').style.display = 'none';
  ['nf-filename','nf-name','nf-desc','nf-body'].forEach(id => document.getElementById(id).value = '');
  await selectProject(activeProjectId);
};
document.getElementById('new-file-modal').onclick = e => {
  if (e.target === e.currentTarget) document.getElementById('new-file-modal').style.display = 'none';
};

// ── New command modal ──────────────────────────────────────────────────────
function openNewCommandModal() {
  document.getElementById('new-command-modal').style.display = 'flex';
  document.getElementById('nc-name').focus();
}
document.getElementById('nc-cancel').onclick = () => {
  document.getElementById('new-command-modal').style.display = 'none';
};
document.getElementById('nc-create').onclick = async () => {
  const name = document.getElementById('nc-name').value.trim();
  const body = document.getElementById('nc-body').value.trim();
  if (!name) { alert('Command name is required.'); return; }
  await api('POST', '/api/commands', { name, content: body + '\n' });
  document.getElementById('new-command-modal').style.display = 'none';
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-body').value = '';
  commands = await api('GET', '/api/commands');
  renderCommandsMiddlePanel();
  renderCommandSidebar();
};
document.getElementById('new-command-modal').onclick = e => {
  if (e.target === e.currentTarget) document.getElementById('new-command-modal').style.display = 'none';
};

// ── Search ─────────────────────────────────────────────────────────────────
let searchDebounce = null;
const searchInput = document.getElementById('search-input');
const typeFilter = document.getElementById('type-filter');

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(doSearch, 200);
});
typeFilter.addEventListener('change', doSearch);

async function doSearch() {
  const q = searchInput.value.trim();
  const type = typeFilter.value;
  const overlay = document.getElementById('search-results');
  if (!q) { overlay.style.display = 'none'; return; }

  const results = await api('GET', `/api/search?q=${encodeURIComponent(q)}&type=${type}`);
  overlay.style.display = 'block';
  overlay.innerHTML = results.length === 0
    ? '<div style="padding:16px;color:var(--muted);font-size:13px">No results</div>'
    : results.map(r => `
      <div class="search-result-item" onclick="jumpToResult('${escAttr(r.filePath)}','${escAttr(r.filename)}','${escAttr(r.projectId)}')">
        <div class="sr-top">
          <span class="type-badge type-${r.type}">${r.type}</span>
          <span class="sr-name">${escHtml(r.name)}</span>
          <span class="sr-project">${escHtml(r.projectLabel)}</span>
        </div>
        <div class="sr-snippet">${escHtml(r.snippet)}</div>
      </div>
    `).join('');
}

async function jumpToResult(filePath, filename, projectId) {
  document.getElementById('search-results').style.display = 'none';
  searchInput.value = '';
  if (activeProjectId !== projectId) {
    switchTab('memory');
    await selectProject(projectId);
  }
  await openFile(filePath, filename);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('search-results').style.display = 'none';
    searchInput.value = '';
  }
});

// ── SSE ────────────────────────────────────────────────────────────────────
function setupSSE() {
  const es = new EventSource('/api/events');
  const dot = document.getElementById('status-dot');
  es.onopen = () => { dot.style.background = 'var(--ok)'; dot.title = 'Live sync active'; };
  es.onerror = () => { dot.style.background = 'var(--err)'; dot.title = 'Connection lost'; };
  es.onmessage = async (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'change') {
      if (currentTab === 'memory' && activeProjectId) {
        await selectProject(activeProjectId);
        projects = await api('GET', '/api/projects');
        renderProjects();
      } else if (currentTab === 'commands') {
        commands = await api('GET', '/api/commands');
        renderCommandsMiddlePanel();
        renderCommandSidebar();
      }
    }
  };
}

// ── Pricing & stats ────────────────────────────────────────────────────────

// Prices from https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-03-26)
// More specific entries first (first match wins).
const PRICING = [
  { match: 'claude-opus-4-6',   input:  5.00, output: 25.00, cw5m:  6.25, cw1h: 10.00, cr: 0.50 },
  { match: 'claude-opus-4-5',   input:  5.00, output: 25.00, cw5m:  6.25, cw1h: 10.00, cr: 0.50 },
  { match: 'claude-opus-4-1',   input: 15.00, output: 75.00, cw5m: 18.75, cw1h: 30.00, cr: 1.50 },
  { match: 'claude-opus-4',     input: 15.00, output: 75.00, cw5m: 18.75, cw1h: 30.00, cr: 1.50 },
  { match: 'claude-sonnet-4',   input:  3.00, output: 15.00, cw5m:  3.75, cw1h:  6.00, cr: 0.30 },
  { match: 'claude-haiku-4-5',  input:  1.00, output:  5.00, cw5m:  1.25, cw1h:  2.00, cr: 0.10 },
  { match: 'claude-haiku-3-5',  input:  0.80, output:  4.00, cw5m:  1.00, cw1h:  1.60, cr: 0.08 },
  { match: 'claude-3-5-sonnet', input:  3.00, output: 15.00, cw5m:  3.75, cw1h:  6.00, cr: 0.30 },
  { match: 'claude-3-opus',     input: 15.00, output: 75.00, cw5m: 18.75, cw1h: 30.00, cr: 1.50 },
  { match: 'claude-3-sonnet',   input:  3.00, output: 15.00, cw5m:  3.75, cw1h:  6.00, cr: 0.30 },
  { match: 'claude-3-haiku',    input:  0.25, output:  1.25, cw5m:  0.30, cw1h:  0.50, cr: 0.03 },
];

function lookupPricing(model) {
  if (!model) return null;
  const m = model.toLowerCase();
  return PRICING.find(p => m.includes(p.match)) || null;
}

function computeConvStats(messages) {
  let inp = 0, out = 0, cw5m = 0, cw1h = 0, cr = 0, apiCalls = 0;
  let model = '';
  for (const r of messages) {
    if (r.type !== 'assistant') continue;
    const usage = r.message?.usage;
    if (!usage) continue;
    apiCalls++;
    if (r.message?.model && !model) model = r.message.model;
    inp  += usage.input_tokens || 0;
    out  += usage.output_tokens || 0;
    cr   += usage.cache_read_input_tokens || 0;
    const cc = usage.cache_creation || {};
    const got5m = cc.ephemeral_5m_input_tokens || 0;
    const got1h = cc.ephemeral_1h_input_tokens || 0;
    if (got5m || got1h) {
      cw5m += got5m;
      cw1h += got1h;
    } else {
      // Older records without breakdown: assume 1h (most common in Claude Code)
      cw1h += usage.cache_creation_input_tokens || 0;
    }
  }

  const p = lookupPricing(model);
  const M = 1_000_000;
  let cost = null, costInp = null, costOut = null, costCw = null, costCr = null;
  let costNoCaching = null;
  if (p) {
    costInp  = inp   / M * p.input;
    costOut  = out   / M * p.output;
    costCw   = (cw5m / M * p.cw5m) + (cw1h / M * p.cw1h);
    costCr   = cr    / M * p.cr;
    cost     = costInp + costOut + costCw + costCr;
    costNoCaching = (inp + cw5m + cw1h + cr) / M * p.input + out / M * p.output;
  }

  return { inp, out, cw5m, cw1h, cr, model, apiCalls, cost, costInp, costOut, costCw, costCr, costNoCaching };
}

function fmtTok(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toString();
}

function fmtCost(n) {
  if (n == null) return '—';
  if (n === 0)   return '$0.00';
  if (n < 0.001) return '<$0.001';
  if (n < 1)     return '$' + n.toFixed(4);
  return '$' + n.toFixed(2);
}

function renderStatsTab(container, messages, conv) {
  const s = computeConvStats(messages);

  const savedAbs = (s.costNoCaching != null && s.cost != null) ? s.costNoCaching - s.cost : null;
  const savedPct = (savedAbs != null && s.costNoCaching > 0) ? savedAbs / s.costNoCaching * 100 : 0;

  const el = document.createElement('div');
  el.className = 'stats-scroll';

  // ── Cost summary ──
  const pricingNote = lookupPricing(s.model) ? '' : ' <span style="color:var(--warn);font-size:10px">(unknown model pricing)</span>';
  el.innerHTML += `
    <div class="stats-card">
      <div class="stats-card-title">Estimated Cost${pricingNote}</div>
      <div class="cost-total">${fmtCost(s.cost)}</div>
      <div class="cost-chips">
        <span class="cost-chip">Input <strong>${fmtCost(s.costInp)}</strong></span>
        <span class="cost-chip">Output <strong>${fmtCost(s.costOut)}</strong></span>
        <span class="cost-chip">Cache write <strong>${fmtCost(s.costCw)}</strong></span>
        <span class="cost-chip">Cache read <strong>${fmtCost(s.costCr)}</strong></span>
      </div>
    </div>
  `;

  // ── Token breakdown ──
  const rows = [
    { label: 'Input (fresh)',   tok: s.inp,  cost: s.costInp, color: '#6366f1' },
    { label: 'Cache write 5m', tok: s.cw5m, cost: s.costCw != null ? s.cw5m / 1e6 * (lookupPricing(s.model)?.cw5m || 0) : null, color: '#f59e0b' },
    { label: 'Cache write 1h', tok: s.cw1h, cost: s.costCw != null ? s.cw1h / 1e6 * (lookupPricing(s.model)?.cw1h || 0) : null, color: '#f97316' },
    { label: 'Cache read',     tok: s.cr,   cost: s.costCr,  color: '#22c55e' },
    { label: 'Output',         tok: s.out,  cost: s.costOut, color: '#3b82f6' },
  ].filter(r => r.tok > 0);

  const totalTok = rows.reduce((sum, r) => sum + r.tok, 0) || 1;

  const barSegs = rows.map(r =>
    `<div class="token-bar-seg" style="width:${(r.tok / totalTok * 100).toFixed(2)}%;background:${r.color}" title="${r.label}: ${fmtTok(r.tok)}"></div>`
  ).join('');

  const tableRows = rows.map(r => `
    <tr>
      <td><span class="tok-dot" style="background:${r.color}"></span>${r.label}</td>
      <td>${fmtTok(r.tok)}</td>
      <td>${fmtCost(r.cost)}</td>
    </tr>
  `).join('');

  el.innerHTML += `
    <div class="stats-card">
      <div class="stats-card-title">Token Breakdown</div>
      <div class="token-bar">${barSegs}</div>
      <table class="tok-table">
        <thead><tr><th>Type</th><th>Tokens</th><th>Cost</th></tr></thead>
        <tbody>
          ${tableRows}
          <tr class="tok-total">
            <td>Total</td>
            <td>${fmtTok(totalTok)}</td>
            <td>${fmtCost(s.cost)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  // ── Cache savings ──
  if (savedAbs != null && savedAbs > 0.0001) {
    el.innerHTML += `
      <div class="stats-card">
        <div class="stats-card-title">Cache Savings</div>
        <div class="savings-labels">
          <span>Actual: <strong style="color:var(--text)">${fmtCost(s.cost)}</strong></span>
          <span>Saved: <strong>${fmtCost(savedAbs)}</strong> (${savedPct.toFixed(0)}%)</span>
        </div>
        <div class="savings-bar-track">
          <div class="savings-bar-fill" style="width:${Math.min(savedPct, 100).toFixed(1)}%"></div>
        </div>
        <div style="font-size:11px;color:var(--muted)">Without caching would cost ${fmtCost(s.costNoCaching)}</div>
      </div>
    `;
  }

  // ── Details ──
  el.innerHTML += `
    <div class="stats-card">
      <div class="stats-card-title">Details</div>
      <div class="stats-meta-row"><span class="label">Model</span><span>${escHtml(s.model || conv.model || '—')}</span></div>
      <div class="stats-meta-row"><span class="label">API calls</span><span>${s.apiCalls}</span></div>
      <div class="stats-meta-row"><span class="label">Started</span><span>${conv.timestamp ? new Date(conv.timestamp).toLocaleString() : '—'}</span></div>
      <div class="stats-meta-row"><span class="label">File size</span><span>${formatBytes(conv.size)}</span></div>
    </div>
  `;

  container.appendChild(el);
}

function showConvStatsPanel(messages, conv) {
  const panel = document.getElementById('conv-stats-panel');
  panel.innerHTML = '';
  panel.classList.add('visible');
  document.querySelector('.layout').classList.add('has-stats-panel');
  document.getElementById('stats-resize-handle').style.display = '';
  applyGridCols();
  const hdr = document.createElement('div');
  hdr.className = 'conv-stats-panel-header';
  hdr.textContent = 'Cost & Tokens';
  panel.appendChild(hdr);
  renderStatsTab(panel, messages, conv);
}

function hideConvStatsPanel() {
  const panel = document.getElementById('conv-stats-panel');
  panel.classList.remove('visible');
  panel.innerHTML = '';
  document.querySelector('.layout').classList.remove('has-stats-panel');
  document.getElementById('stats-resize-handle').style.display = 'none';
  applyGridCols();
}

// ── Conversation viewer ────────────────────────────────────────────────────
async function openConversation(conv) {
  activeConvPath = conv.filePath;
  activeFilePath = null;
  modified = false;

  // Highlight in list
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  event?.currentTarget?.classList.add('active');

  const pane = document.getElementById('editor-pane');
  pane.innerHTML = `<div class="empty">${ICON_FILE}Loading…</div>`;

  const messages = await api('GET', `/api/conversation?path=${encodeURIComponent(conv.filePath)}`);
  renderChatView(pane, conv, messages);
}

function renderChatView(pane, conv, messages) {
  pane.innerHTML = '';

  const toolbar = document.createElement('div');
  toolbar.className = 'editor-toolbar';
  const userTurns = messages.filter(m => m.type === 'user' && !m.isMeta).length;
  toolbar.innerHTML = `
    <div class="editor-filename">${escHtml(conv.filePath)}</div>
    <span style="font-size:11px;color:var(--muted)">${userTurns} turns · ${escHtml(conv.model || '')}</span>
    <button class="stats-toggle-btn${statsPanelOpen ? ' active' : ''}" id="stats-toggle-btn">Cost & Tokens</button>
  `;
  pane.appendChild(toolbar);

  toolbar.querySelector('#stats-toggle-btn').addEventListener('click', () => {
    statsPanelOpen = !statsPanelOpen;
    toolbar.querySelector('#stats-toggle-btn').classList.toggle('active', statsPanelOpen);
    if (statsPanelOpen) showConvStatsPanel(messages, conv);
    else hideConvStatsPanel();
  });

  const scroll = document.createElement('div');
  scroll.className = 'chat-scroll';
  renderChatMessages(scroll, messages);
  pane.appendChild(scroll);
  scroll.scrollTop = scroll.scrollHeight;

  if (statsPanelOpen) showConvStatsPanel(messages, conv);
  else hideConvStatsPanel();
}

function renderChatMessages(scroll, messages) {
  for (const record of messages) {
    const isUser = record.type === 'user';
    const turn = document.createElement('div');
    turn.className = 'chat-turn';

    const roleEl = document.createElement('div');
    roleEl.className = 'chat-role';
    roleEl.textContent = isUser ? 'You' : 'Claude';
    turn.appendChild(roleEl);

    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${isUser ? 'chat-bubble-user' : 'chat-bubble-assistant'}`;

    const content = record.message?.content;
    if (typeof content === 'string') {
      bubble.innerHTML = isUser ? `<p>${escHtml(content)}</p>` : marked.parse(content);
    } else if (Array.isArray(content)) {
      for (const block of content) {
        if (block.type === 'text') {
          const d = document.createElement('div');
          d.className = 'md-preview';
          d.innerHTML = marked.parse(block.text || '');
          bubble.appendChild(d);
        } else if (block.type === 'tool_use') {
          const t = document.createElement('div');
          t.className = 'chat-tool';
          t.textContent = `⚙ ${block.name}`;
          t.title = JSON.stringify(block.input || {}, null, 2);
          bubble.appendChild(t);
        } else if (block.type === 'tool_result') {
          // skip
        }
      }
    }

    if (!bubble.innerHTML.trim()) continue;
    turn.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'chat-meta';
    meta.textContent = record.timestamp ? new Date(record.timestamp).toLocaleString() : '';
    turn.appendChild(meta);

    scroll.appendChild(turn);
  }
}

// ── Utils ──────────────────────────────────────────────────────────────────
function relativeTime(mtime) {
  const diff = Date.now() - new Date(mtime).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months}mo ago`;
  return `${Math.floor(months / 12)}y ago`;
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}
