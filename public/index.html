<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Memory GUI</title>
  <link rel="icon" type="image/png" href="claude-code-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Header -->
<header>
  <h1>Claude Memory GUI</h1>
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Search claude files..." autocomplete="off" />
    <select id="type-filter">
      <option value="">All</option>
      <option value="claude_md">md file</option>
      <option value="memory">memory</option>
      <option value="chat">chat</option>
    </select>
  </div>
  <div id="status-dot" title="Live sync active"></div>
</header>

<!-- Search results overlay -->
<div id="search-results"></div>

<!-- Main layout -->
<div class="layout">

  <!-- Sidebar with tabs -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" id="tab-memory" onclick="switchTab('memory')">Projects</div>
      <div class="sidebar-tab" id="tab-commands" onclick="switchTab('commands')">Commands</div>
    </div>

    <!-- Projects list (memory tab) -->
    <div class="sidebar-section" id="section-memory">
      <!-- Content type filter bar -->
      <div class="filter-bar">
        <button class="filter-item active" id="fp-memory" onclick="toggleFilter('memory')"><span class="filter-dot"></span>Memory</button>
        <button class="filter-item active" id="fp-claudemd" onclick="toggleFilter('claudemd')"><span class="filter-dot"></span>MD files</button>
        <button class="filter-item active" id="fp-conversations" onclick="toggleFilter('conversations')"><span class="filter-dot"></span>Chats</button>
      </div>
      <div class="sidebar-header-row">
        <div class="sidebar-title">Projects</div>
        <button class="toggle-empty on" id="toggle-empty-btn" onclick="toggleShowEmpty()">hide empty</button>
      </div>
      <div id="project-list"></div>
      <div class="tree-footer" id="tree-footer"></div>
    </div>

    <!-- Commands list (commands tab) -->
    <div class="sidebar-section hidden" id="section-commands">
      <div class="sidebar-title">Custom Commands</div>
      <div id="command-sidebar-list"></div>
    </div>
  </div>

  <div class="resize-handle" data-col="sidebar"><div class="resize-grip"></div></div>

  <!-- Middle: file list OR command list -->
  <div class="file-list-col">
    <div class="file-search-row" id="file-search-row">
      <span class="file-search-icon">⌕</span>
      <input type="text" class="file-search-input" id="file-search-input" placeholder="Search files…" />
    </div>
    <div class="file-list-header" id="file-list-header"></div>
    <div class="file-list" id="file-list">
      <div class="empty">Select a project</div>
    </div>
    <div class="file-list-footer" id="file-list-footer"></div>
  </div>

  <div class="resize-handle" data-col="filelist"><div class="resize-grip"></div></div>

  <!-- Editor pane -->
  <div class="editor-pane" id="editor-pane">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="editor-content" id="editor-content">
      <div class="empty">Select a file to view</div>
    </div>
  </div>

  <div class="resize-handle" data-col="stats" id="stats-resize-handle" style="display:none"><div class="resize-grip"></div></div>

  <!-- Conversation stats panel (right side, only shown for chat files) -->
  <div class="conv-stats-panel" id="conv-stats-panel"></div>

</div>

<!-- New memory modal -->
<div class="modal-overlay" id="new-file-modal" style="display:none">
  <div class="modal">
    <h2>New Memory File</h2>
    <div class="field">
      <label>Filename (without .md)</label>
      <input id="nf-filename" type="text" placeholder="e.g. feedback_testing" />
    </div>
    <div class="field">
      <label>Name</label>
      <input id="nf-name" type="text" placeholder="Short descriptive name" />
    </div>
    <div class="field">
      <label>Description</label>
      <input id="nf-desc" type="text" placeholder="One-line description" />
    </div>
    <div class="field">
      <label>Type</label>
      <select id="nf-type">
        <option value="user">user</option>
        <option value="feedback">feedback</option>
        <option value="project">project</option>
        <option value="reference">reference</option>
      </select>
    </div>
    <div class="field">
      <label>Body</label>
      <textarea id="nf-body" rows="4" placeholder="Memory content…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nf-cancel">Cancel</button>
      <button class="btn" id="nf-create">Create</button>
    </div>
  </div>
</div>

<!-- New command modal -->
<div class="modal-overlay" id="new-command-modal" style="display:none">
  <div class="modal">
    <h2>New Command</h2>
    <div class="field">
      <label>Command name (used as /name in Claude Code)</label>
      <input id="nc-name" type="text" placeholder="e.g. my-task" />
    </div>
    <div class="field">
      <label>Instructions (what Claude should do when invoked)</label>
      <textarea id="nc-body" rows="6" placeholder="Describe what this command should do…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="nc-cancel">Cancel</button>
      <button class="btn" id="nc-create">Create</button>
    </div>
  </div>
</div>


<script src="js/utils.js"></script>
<script src="js/resize.js"></script>
<script src="js/stats.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let projects = [];
let commands = [];
let activeProjectId = null;
let activeFilePath = null;
let files = [];
let modified = false;
let saveTimeout = null;
let currentTab = 'memory'; // 'memory' | 'commands'
let activeConvPath = null;
let statsPanelOpen = true; // remembers toggle state across conversations
let cachedHealth = [];
let cachedConversations = [];
let cachedMdFiles = [];
let fileSearchQuery = '';

// ── Tabs ───────────────────────────────────────────────────────────────────
let openTabs = [];
let activeTabId = null;

function getActiveTab() { return openTabs.find(t => t.id === activeTabId) || null; }
function tabIdFor(type, path) { return type + ':' + path; }

function syncToActiveTab() {
  const tab = getActiveTab();
  if (!tab || tab.type !== 'file') return;
  const ta = document.querySelector('#editor-content textarea');
  if (ta) { tab.content = ta.value; activeFileContent = ta.value; }
  tab.modified = modified;
  tab.mode = editorMode;
}

function renderTabBar() {
  const bar = document.getElementById('tab-bar');
  if (!bar) return;
  bar.innerHTML = '';
  for (const tab of openTabs) {
    const item = document.createElement('div');
    item.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '');
    const icon = tab.type === 'conv' ? '<img src="claude-code-icon.png" class="tab-claude-icon" />' : '📄';
    const label = tab.type === 'conv'
      ? (tab.conv.firstUserMessage || 'Conversation').slice(0, 35)
      : tab.filename;
    item.innerHTML = `<span class="tab-icon">${icon}</span><span class="tab-label">${escHtml(label)}</span>${tab.modified ? '<span class="tab-modified">●</span>' : ''}<button class="tab-close" title="Close">×</button>`;
    item.addEventListener('click', () => activateTab(tab.id));
    item.addEventListener('mousedown', e => { if (e.button === 1) { e.preventDefault(); closeTab(tab.id); } });
    item.querySelector('.tab-close').addEventListener('click', e => { e.stopPropagation(); closeTab(tab.id); });
    bar.appendChild(item);
  }
}

function syncFileListActive() {
  const activePath = activeFilePath || activeConvPath || '';
  document.querySelectorAll('#file-list .file-item').forEach(el => {
    el.classList.toggle('active', el.dataset.filepath === activePath && activePath !== '');
  });
}

function activateTab(id) {
  if (id === activeTabId) return;
  syncToActiveTab();
  activeTabId = id;
  const tab = getActiveTab();
  if (!tab) return;
  if (tab.type === 'file') {
    activeFilePath = tab.filePath;
    activeConvPath = null;
    activeFileContent = tab.content;
    modified = tab.modified;
    editorMode = tab.mode;
    hideConvStatsPanel();
    renderEditor(tab.filePath, tab.filename, tab.content);
  } else {
    activeConvPath = tab.filePath;
    activeFilePath = null;
    modified = false;
    renderChatView(document.getElementById('editor-content'), tab.conv, tab.messages);
  }
  renderTabBar();
  syncFileListActive();
  saveTabState();
}

function closeTab(id) {
  const idx = openTabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  const tab = openTabs[idx];
  if (tab.modified && !confirm('Close without saving?')) return;
  if (tab.type === 'file' && tab.modified) clearTimeout(saveTimeout);
  openTabs.splice(idx, 1);
  if (activeTabId === id) {
    const next = openTabs[idx] || openTabs[idx - 1] || null;
    activeTabId = next ? next.id : null;
    const ec = document.getElementById('editor-content');
    if (!next) {
      activeFilePath = null; activeConvPath = null; modified = false;
      hideConvStatsPanel();
      ec.innerHTML = `<div class="empty">${ICON_FILE}Select a file to view</div>`;
    } else if (next.type === 'file') {
      activeFilePath = next.filePath; activeConvPath = null;
      activeFileContent = next.content; modified = next.modified; editorMode = next.mode;
      hideConvStatsPanel();
      renderEditor(next.filePath, next.filename, next.content);
    } else {
      activeConvPath = next.filePath; activeFilePath = null; modified = false;
      renderChatView(ec, next.conv, next.messages);
    }
  }
  renderTabBar();
  syncFileListActive();
  saveTabState();
}

// ── Persisted UI state ─────────────────────────────────────────────────────
const UI_STORAGE_KEY = 'memgui_ui';
function loadUIState() {
  try { return JSON.parse(localStorage.getItem(UI_STORAGE_KEY) || '{}'); } catch { return {}; }
}
function saveUIState(patch) {
  const s = loadUIState();
  localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({ ...s, ...patch }));
}
function saveTabState() {
  const tabsToSave = openTabs.map(t => ({
    id: t.id, type: t.type, filePath: t.filePath, filename: t.filename, mode: t.mode || 'preview',
  }));
  saveUIState({ savedTabs: tabsToSave, activeTabId, activeProjectId });
}
const _ui = loadUIState();
let fileSort = _ui.fileSort ?? 'modified';
let groupFiles = _ui.groupFiles ?? true;
let showEmptyProjects = _ui.showEmptyProjects ?? true;
let activeFilters = new Set(_ui.activeFilters ?? ['memory', 'claudemd', 'conversations']);
let blameGutterVisible = _ui.blameGutterVisible ?? true;
const collapsedSections = new Set(); // 'alpha' | 'modified'


// ── API ────────────────────────────────────────────────────────────────────
async function api(method, url, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Session restore ────────────────────────────────────────────────────────
async function restoreSessionState() {
  const s = loadUIState();
  if (!s.activeProjectId) return;

  // Re-select the saved project (loads files + cachedConversations)
  await selectProject(s.activeProjectId);

  // Re-open saved tabs
  const saved = s.savedTabs || [];
  for (const saved_tab of saved) {
    if (openTabs.find(t => t.id === saved_tab.id)) continue; // already open
    if (saved_tab.type === 'file') {
      try {
        const { content } = await api('GET', `/api/file?path=${encodeURIComponent(saved_tab.filePath)}`);
        openTabs.push({ id: saved_tab.id, type: 'file', filePath: saved_tab.filePath, filename: saved_tab.filename, content, modified: false, mode: saved_tab.mode || 'preview' });
      } catch {}
    } else if (saved_tab.type === 'conv') {
      const conv = cachedConversations.find(c => c.filePath === saved_tab.filePath);
      if (!conv) continue;
      try {
        const messages = await api('GET', `/api/conversation?path=${encodeURIComponent(saved_tab.filePath)}`);
        openTabs.push({ id: saved_tab.id, type: 'conv', filePath: saved_tab.filePath, filename: saved_tab.filename, conv, messages });
      } catch {}
    }
  }

  // Activate saved active tab (or first available)
  const targetId = openTabs.find(t => t.id === s.activeTabId) ? s.activeTabId : (openTabs[0]?.id || null);
  if (targetId) {
    activeTabId = targetId;
    const tab = getActiveTab();
    const ec = document.getElementById('editor-content');
    if (tab.type === 'file') {
      activeFilePath = tab.filePath; activeConvPath = null;
      activeFileContent = tab.content; modified = false; editorMode = tab.mode;
      renderEditor(tab.filePath, tab.filename, tab.content);
    } else {
      activeConvPath = tab.filePath; activeFilePath = null;
      renderChatView(ec, tab.conv, tab.messages);
    }
    renderTabBar();
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  applyGridCols();
  // Restore persisted UI state
  ['memory', 'claudemd', 'conversations'].forEach(key => {
    document.getElementById(`fp-${key}`)?.classList.toggle('active', activeFilters.has(key));
  });
  const emptyBtn = document.getElementById('toggle-empty-btn');
  if (emptyBtn) {
    emptyBtn.classList.toggle('on', showEmptyProjects);
    emptyBtn.textContent = showEmptyProjects ? 'hide empty' : 'show empty';
  }
  [projects, commands] = await Promise.all([
    api('GET', '/api/projects'),
    api('GET', '/api/commands'),
  ]);
  renderProjects();
  renderCommandSidebar();
  setupSSE();
  await restoreSessionState();
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-memory').classList.toggle('active', tab === 'memory');
  document.getElementById('tab-commands').classList.toggle('active', tab === 'commands');
  document.getElementById('section-memory').classList.toggle('hidden', tab !== 'memory');
  document.getElementById('section-commands').classList.toggle('hidden', tab !== 'commands');

  if (tab === 'commands') {
    renderCommandsMiddlePanel();
  } else {
    // Restore memory panel
    if (activeProjectId) {
      selectProject(activeProjectId);
    } else {
      document.getElementById('file-list').innerHTML = `<div class="empty">${ICON_FOLDER}Select a project</div>`;
    }
  }
}

// ── Visible count per project (respects active filters, uses cached data) ──
function visibleCount(proj) {
  let n = 0;
  if (activeFilters.has('memory')) n += proj.memoryCount || 0;
  if (activeFilters.has('claudemd')) n += proj.mdFileCount || 0;
  if (activeFilters.has('conversations')) n += proj.conversationCount || 0;
  return n;
}

// ── Content type filter ────────────────────────────────────────────────────
async function toggleFilter(key) {
  if (activeFilters.has(key)) {
    if (activeFilters.size === 1) return;
    activeFilters.delete(key);
  } else {
    activeFilters.add(key);
    if (key === 'conversations' && activeProjectId && cachedConversations.length === 0) {
      cachedConversations = await api('GET', `/api/projects/${activeProjectId}/conversations`);
    }
  }
  saveUIState({ activeFilters: [...activeFilters] });
  document.getElementById(`fp-${key}`).classList.toggle('active', activeFilters.has(key));
  renderProjects(); // cheap — uses cached projects array, no server call
  if (activeProjectId) {
    const proj = projects.find(p => p.id === activeProjectId);
    renderFileList(proj, files, cachedHealth, cachedConversations);
  }
}

// ── File sort ──────────────────────────────────────────────────────────────
async function setFileSort(mode, e) {
  e.stopPropagation();
  fileSort = mode;
  saveUIState({ fileSort });
  if (activeProjectId) await selectProject(activeProjectId);
}

// ── Group toggle ───────────────────────────────────────────────────────────
function toggleGroupFiles() {
  groupFiles = !groupFiles;
  saveUIState({ groupFiles });
  const btn = document.getElementById('group-toggle-btn');
  if (btn) btn.classList.toggle('on', groupFiles);
  const proj = projects.find(p => p.id === activeProjectId);
  if (proj) renderFileList(proj, files, cachedHealth, cachedConversations);
}

// ── Show-empty toggle ──────────────────────────────────────────────────────
function toggleShowEmpty() {
  showEmptyProjects = !showEmptyProjects;
  saveUIState({ showEmptyProjects });
  const btn = document.getElementById('toggle-empty-btn');
  btn.classList.toggle('on', showEmptyProjects);
  btn.textContent = showEmptyProjects ? 'hide empty' : 'show empty';
  renderProjects();
}

// ── Project tree building ──────────────────────────────────────────────────
function buildProjectTree(projectList) {
  const nonGlobal = projectList.filter(p => p.id !== '__global__');
  // Parse each id into segments
  const parsed = nonGlobal.map(p => ({
    project: p,
    segments: p.id.replace(/^-/, '').split('-').filter(Boolean),
  }));

  // Find common prefix to strip (home dir segments shared by all)
  let prefixLen = 0;
  if (parsed.length > 0) {
    const first = parsed[0].segments;
    outer: for (let i = 0; i < first.length - 1; i++) {
      for (const { segments } of parsed) {
        if (segments[i] !== first[i]) break outer;
      }
      prefixLen = i + 1;
    }
  }

  // Build trie from remaining segments
  const root = { children: {}, project: null };
  for (const { project, segments } of parsed) {
    const rel = segments.slice(prefixLen);
    if (rel.length === 0) continue;
    let node = root;
    for (let i = 0; i < rel.length; i++) {
      const seg = rel[i];
      if (!node.children[seg]) node.children[seg] = { children: {}, project: null };
      if (i === rel.length - 1) node.children[seg].project = project;
      node = node.children[seg];
    }
  }
  return root;
}

// Collapse single-child folders into one label (path compression)
function compressTree(node) {
  const keys = Object.keys(node.children);
  for (const key of keys) {
    compressTree(node.children[key]);
    const child = node.children[key];
    // If this folder has exactly one child and no project of its own, merge
    const childKeys = Object.keys(child.children);
    if (!child.project && childKeys.length === 1) {
      const grandKey = childKeys[0];
      const grandChild = child.children[grandKey];
      delete node.children[key];
      const mergedKey = key + '/' + grandKey;
      node.children[mergedKey] = grandChild;
    }
  }
}

// ── Render projects ────────────────────────────────────────────────────────
// Track which folders have been explicitly closed (everything open by default)
const closedFolders = new Set();

function renderProjects() {
  const el = document.getElementById('project-list');
  el.innerHTML = '';

  const filtered = showEmptyProjects ? projects : projects.filter(p => p.id === '__global__' || visibleCount(p) > 0);

  // Global entry at top
  const global = filtered.find(p => p.id === '__global__');
  if (global) {
    const item = document.createElement('div');
    item.className = 'project-item' + (global.id === activeProjectId ? ' active' : '');
    item.style.paddingLeft = '12px';
    item.innerHTML = `
      <span class="project-label">🌐 Global</span>
      <span class="project-count">${visibleCount(global)}</span>
    `;
    item.onclick = () => { switchTab('memory'); selectProject(global.id); };
    el.appendChild(item);
  }

  // Build tree for non-global
  const tree = buildProjectTree(filtered);
  renderTreeNode(el, tree, 0, '');

  // Footer counts (across ALL projects, not just filtered)
  const footerEl = document.getElementById('tree-footer');
  if (footerEl) {
    const totalMem = projects.reduce((s, p) => s + (p.memoryCount || 0), 0);
    const totalMd = projects.reduce((s, p) => s + (p.mdFileCount || 0), 0);
    const totalConv = projects.reduce((s, p) => s + (p.conversationCount || 0), 0);
    const parts = [
      { label: `${totalMem} memories`, color: 'var(--user)' },
      { label: `${totalMd} MD files`, color: 'var(--claude_md)' },
      { label: `${totalConv} chats`, color: 'var(--project)' },
    ];
    footerEl.innerHTML = parts.map(p =>
      `<span class="tree-footer-item"><span class="tree-footer-dot" style="background:${p.color}"></span>${p.label}</span>`
    ).join('');
  }
}

function renderTreeNode(container, node, depth, pathKey) {
  const keys = Object.keys(node.children).sort();
  for (const key of keys) {
    const child = node.children[key];
    const childPath = pathKey ? pathKey + '/' + key : key;
    const hasChildren = Object.keys(child.children).length > 0;
    const isOpen = !closedFolders.has(childPath);
    const indent = 12 + depth * 14;

    if (hasChildren) {
      // Folder row
      const folder = document.createElement('div');
      folder.className = 'tree-folder';

      const row = document.createElement('div');
      row.className = 'tree-folder-row';
      row.style.paddingLeft = indent + 'px';
      row.innerHTML = `
        <span class="tree-chevron${isOpen ? ' open' : ''}">▶</span>
        <span class="tree-folder-label">${escHtml(key)}</span>
      `;
      row.onclick = () => {
        if (closedFolders.has(childPath)) closedFolders.delete(childPath);
        else closedFolders.add(childPath);
        renderProjects();
        // If the folder itself is a project, also select it
        if (child.project) { switchTab('memory'); selectProject(child.project.id); }
      };
      folder.appendChild(row);

      // If this folder IS also a project, add a click target
      if (child.project) {
        const proj = child.project;
        row.title = proj.id;
        // Count badge on the folder row
        const badge = document.createElement('span');
        badge.className = 'project-count';
        badge.textContent = visibleCount(proj);
        row.appendChild(badge);
        row.classList.toggle('active-folder', proj.id === activeProjectId);
      }

      const childrenEl = document.createElement('div');
      childrenEl.className = 'tree-children' + (isOpen ? ' open' : '');
      childrenEl.style.setProperty('--guide-x', (indent + 7) + 'px');
      renderTreeNode(childrenEl, child, depth + 1, childPath);
      folder.appendChild(childrenEl);
      container.appendChild(folder);
    } else {
      // Leaf project item
      const proj = child.project;
      if (!proj) continue;
      const item = document.createElement('div');
      item.className = 'project-item' + (proj.id === activeProjectId ? ' active' : '');
      item.style.paddingLeft = (indent + 20) + 'px';
      item.innerHTML = `
        <span class="project-label" title="${escHtml(proj.id)}">${escHtml(key)}</span>
        <span class="project-count">${visibleCount(proj)}</span>
      `;
      item.onclick = () => { switchTab('memory'); selectProject(proj.id); };
      container.appendChild(item);
    }
  }
}

// ── Select project ─────────────────────────────────────────────────────────
async function selectProject(id) {
  document.getElementById('file-list').innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  document.getElementById('file-list-footer').innerHTML = '';

  if (id !== activeProjectId) { cachedHealth = []; cachedConversations = []; cachedMdFiles = []; fileSearchQuery = ''; }
  activeProjectId = id;
  saveUIState({ activeProjectId });
  renderProjects();

  const proj = projects.find(p => p.id === id);
  const fetches = [
    api('GET', `/api/projects/${id}/memories`),
    api('GET', `/api/projects/${id}/health`),
    activeFilters.has('conversations') ? api('GET', `/api/projects/${id}/conversations`) : Promise.resolve([]),
    activeFilters.has('claudemd') ? api('GET', `/api/projects/${id}/mdfiles`) : Promise.resolve([]),
  ];
  const [memFiles, health, conversations, mdFiles] = await Promise.all(fetches);
  files = memFiles;
  cachedHealth = health;
  cachedConversations = conversations;
  cachedMdFiles = mdFiles;
  renderFileList(proj, files, cachedHealth, cachedConversations, cachedMdFiles);

  // Refresh content of any open file tabs that belong to this project
  for (const tab of openTabs) {
    if (tab.type !== 'file' || tab.modified) continue;
    try {
      const { content } = await api('GET', `/api/file?path=${encodeURIComponent(tab.filePath)}`);
      tab.content = content;
      if (tab.id === activeTabId) {
        activeFileContent = content;
        renderEditor(tab.filePath, tab.filename, content);
      }
    } catch {}
  }
}

// ── Render file list ───────────────────────────────────────────────────────
function renderFileList(proj, files, health, conversations = [], mdFiles = []) {
  const el = document.getElementById('file-list');
  el.innerHTML = '';

  const memCount = files.filter(f => f.filename !== 'MEMORY.md').length;
  const countParts = [];
  if (activeFilters.has('claudemd') && mdFiles.length) countParts.push(`${mdFiles.length} MD files`);
  if (activeFilters.has('memory')) countParts.push(`${memCount} memories`);
  if (activeFilters.has('conversations')) countParts.push(`${conversations.length} chats`);
  // ── Fixed header: search + controls (live in the col wrapper, not scroll area) ──
  const searchInp = document.getElementById('file-search-input');
  searchInp.value = fileSearchQuery;
  // Re-attach listener each render (old clone trick avoids duplicates)
  const freshSearch = searchInp.cloneNode(true);
  searchInp.replaceWith(freshSearch);
  freshSearch.value = fileSearchQuery;

  const hdr = document.getElementById('file-list-header');
  hdr.innerHTML = '';

  const sortToggle = document.createElement('div');
  sortToggle.className = 'sort-toggle';
  sortToggle.innerHTML = `
    <button class="sort-btn ${fileSort === 'alpha' ? 'active' : ''}" onclick="setFileSort('alpha', arguments[0])">A–Z</button>
    <button class="sort-btn ${fileSort === 'modified' ? 'active' : ''}" onclick="setFileSort('modified', arguments[0])">Recent</button>
  `;
  hdr.appendChild(sortToggle);

  const grpBtn = document.createElement('button');
  grpBtn.id = 'group-toggle-btn';
  grpBtn.className = 'group-toggle-btn' + (groupFiles ? ' on' : '');
  grpBtn.title = 'Toggle grouped view';
  grpBtn.innerHTML = '<span class="gtb-dot"></span>Group';
  grpBtn.onclick = toggleGroupFiles;
  grpBtn.style.marginLeft = 'auto';
  hdr.appendChild(grpBtn);

  const reloadBtn = document.createElement('button');
  reloadBtn.className = 'reload-btn';
  reloadBtn.title = 'Reload';
  reloadBtn.innerHTML = '↻';
  reloadBtn.onclick = () => { if (activeProjectId) selectProject(activeProjectId); };
  hdr.appendChild(reloadBtn);

  function applyFileSearch(q) {
    fileSearchQuery = q.toLowerCase().trim();
    const items = el.querySelectorAll('.file-item');
    items.forEach(item => {
      const match = !fileSearchQuery || item.dataset.searchtext?.includes(fileSearchQuery);
      item.style.display = match ? '' : 'none';
    });
    // Hide section dividers when all their children are hidden
    el.querySelectorAll('.section-divider').forEach(div => {
      const body = div.nextElementSibling;
      if (!body) return;
      const anyVisible = [...body.querySelectorAll('.file-item')].some(i => i.style.display !== 'none');
      div.style.display = anyVisible ? '' : 'none';
      body.style.display = anyVisible ? '' : 'none';
    });
  }

  freshSearch.addEventListener('input', e => applyFileSearch(e.target.value));

  // ── Unified file item renderer ───────────────────────────────────────────
  function makeFileItem({ filePath, name, badge, badgeClass, desc, metaLeft, mtime, isActive, searchtext, onclick }) {
    const item = document.createElement('div');
    item.className = 'file-item' + (isActive ? ' active' : '');
    item.innerHTML = `
      <div class="file-item-name">
        <span class="file-item-name-text">${escHtml(name)}</span>
        <span class="type-badge${badgeClass ? ' ' + badgeClass : ''}">${badge}</span>
      </div>
      ${desc ? `<div class="file-item-desc">${escHtml(desc)}</div>` : ''}
      <div class="file-item-meta">
        <span>${metaLeft ? escHtml(String(metaLeft)) : ''}</span>
        <span>${relativeTime(mtime)}</span>
      </div>
    `;
    item.onclick = onclick;
    item.dataset.filepath = filePath || '';
    item.dataset.mtime = mtime || '';
    item.dataset.name = name;
    item.dataset.searchtext = searchtext;
    return item;
  }

  const makeMdFileItem   = f    => makeFileItem({ filePath: f.filePath, name: f.description || f.filename, badge: 'md', badgeClass: 'type-md', desc: null, metaLeft: null, mtime: f.mtime, isActive: activeFilePath === f.filePath, searchtext: ((f.filename || '') + ' ' + (f.description || '')).toLowerCase(), onclick: () => openFile(f.filePath, f.filename) });
  const makeMemoryItem   = f    => makeFileItem({ filePath: f.filePath, name: f.name, badge: 'memory', desc: f.description || f.filename, metaLeft: `${f.lineCount} lines`, mtime: f.mtime, isActive: activeFilePath === f.filePath, searchtext: ((f.name || '') + ' ' + (f.description || '') + ' ' + (f.body || '')).toLowerCase(), onclick: () => openFile(f.filePath, f.filename) });
  const makeConvItem     = conv => makeFileItem({ filePath: conv.filePath, name: conv.firstUserMessage || 'Empty conversation', badge: 'chat', desc: conv.model || null, metaLeft: formatBytes(conv.size), mtime: conv.mtime, isActive: activeConvPath === conv.filePath, searchtext: ((conv.firstUserMessage || '') + ' ' + (conv.cwd || '')).toLowerCase(), onclick: () => openConversation(conv) });

  const sortedMemory = [...files]
    .filter(f => f.filename !== 'MEMORY.md')
    .sort((a, b) => fileSort === 'modified'
      ? new Date(b.mtime) - new Date(a.mtime)
      : a.name.localeCompare(b.name));

  const sortedConvs = [...conversations]
    .sort((a, b) => fileSort === 'modified'
      ? new Date(b.mtime) - new Date(a.mtime)
      : (a.firstUserMessage || '').localeCompare(b.firstUserMessage || ''));

  const sortedMdFiles = [...mdFiles]
    .sort((a, b) => fileSort === 'modified'
      ? new Date(b.mtime) - new Date(a.mtime)
      : (a.description || a.filename).localeCompare(b.description || b.filename));

  function makeCollapsibleSection(key, label, buildItems) {
    const isCollapsed = collapsedSections.has(key);
    const divider = document.createElement('div');
    divider.className = 'section-divider';
    const chevron = document.createElement('span');
    chevron.className = 'section-chevron';
    chevron.textContent = isCollapsed ? '›' : '⌄';
    divider.appendChild(document.createTextNode(label));
    divider.appendChild(chevron);
    const body = document.createElement('div');
    body.className = 'section-body' + (isCollapsed ? ' collapsed' : '');
    buildItems(body);
    divider.onclick = () => {
      if (collapsedSections.has(key)) collapsedSections.delete(key);
      else collapsedSections.add(key);
      const nowCollapsed = collapsedSections.has(key);
      chevron.textContent = nowCollapsed ? '›' : '⌄';
      body.classList.toggle('collapsed', nowCollapsed);
    };
    el.appendChild(divider);
    el.appendChild(body);
  }

  if (groupFiles) {
    // ── Grouped view ──────────────────────────────────────────────────────
    const activeSectionCount = [
      activeFilters.has('claudemd') && mdFiles.length > 0,
      activeFilters.has('memory'),
      activeFilters.has('conversations') && conversations.length > 0
    ].filter(Boolean).length;
    const showDividers = activeSectionCount > 1;

    if (activeFilters.has('claudemd') && mdFiles.length > 0) {
      if (showDividers) {
        makeCollapsibleSection('claudemd', `MD files · ${mdFiles.length}`, body => {
          for (const f of sortedMdFiles) body.appendChild(makeMdFileItem(f));
        });
      } else {
        for (const f of sortedMdFiles) el.appendChild(makeMdFileItem(f));
      }
    }

    if (activeFilters.has('memory')) {
      if (showDividers) {
        makeCollapsibleSection('memory', `Memory · ${memCount}`, body => {
          for (const f of sortedMemory) body.appendChild(makeMemoryItem(f));
        });
      } else {
        for (const f of sortedMemory) el.appendChild(makeMemoryItem(f));
      }
    }

    if (activeFilters.has('conversations') && conversations.length > 0) {
      if (showDividers) {
        makeCollapsibleSection('conversations', `Conversations · ${conversations.length}`, body => {
          for (const conv of sortedConvs) body.appendChild(makeConvItem(conv));
        });
      } else {
        for (const conv of sortedConvs) el.appendChild(makeConvItem(conv));
      }
    }
  } else {
    // ── Flat view — all items interleaved, sorted by current sort ─────────
    const allItems = [];

    if (activeFilters.has('claudemd')) {
      for (const f of mdFiles) {
        allItems.push({ el: makeMdFileItem(f), mtime: new Date(f.mtime), name: f.description || f.filename });
      }
    }
    if (activeFilters.has('memory')) {
      for (const f of files.filter(f => f.filename !== 'MEMORY.md')) {
        allItems.push({ el: makeMemoryItem(f), mtime: new Date(f.mtime), name: f.name });
      }
    }
    if (activeFilters.has('conversations')) {
      for (const conv of conversations) {
        allItems.push({ el: makeConvItem(conv), mtime: new Date(conv.mtime), name: conv.firstUserMessage || '' });
      }
    }

    allItems.sort((a, b) => fileSort === 'modified'
      ? b.mtime - a.mtime
      : a.name.localeCompare(b.name));

    for (const item of allItems) el.appendChild(item.el);
  }

  // Health panel
  if (health.length > 0) {
    const hp = document.createElement('div');
    hp.className = 'health-panel';
    for (const issue of health) {
      const icon = issue.level === 'error' ? '🔴' : '🟡';
      hp.innerHTML += `<div class="health-item"><span class="health-icon">${icon}</span><span>${escHtml(issue.message)}</span></div>`;
    }
    el.appendChild(hp);
  }

  if (fileSearchQuery) applyFileSearch(fileSearchQuery);

  // Count footer (rendered outside scroll area so it sticks to bottom)
  const footerEl = document.getElementById('file-list-footer');
  const footer = footerEl || document.createElement('div');
  footer.innerHTML = '';
  const countSpan = document.createElement('span');
  countSpan.textContent = countParts.join(' · ') || 'Nothing selected';
  footer.appendChild(countSpan);
  if (proj && proj.path) {
    const pathRow = document.createElement('div');
    pathRow.className = 'file-list-footer-path-row';
    const pathSpan = document.createElement('span');
    pathSpan.className = 'file-list-footer-path';
    pathSpan.textContent = proj.path;
    pathSpan.title = proj.path;
    pathRow.appendChild(pathSpan);
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-path-btn';
    copyBtn.title = 'Copy path';
    copyBtn.textContent = '⎘';
    copyBtn.onclick = async () => {
      await navigator.clipboard.writeText(proj.path);
      copyBtn.textContent = '✓';
      setTimeout(() => { copyBtn.textContent = '⎘'; }, 1200);
    };
    pathRow.appendChild(copyBtn);
    footer.appendChild(pathRow);
  }
  if (!footerEl) el.appendChild(footer);
}

// ── Editor mode: 'preview' | 'edit' ───────────────────────────────────────
let editorMode = 'preview';
let activeFileContent = '';

// ── Open file ──────────────────────────────────────────────────────────────
async function openFile(filePath, filename) {
  const id = tabIdFor('file', filePath);
  const existing = openTabs.find(t => t.id === id);
  if (existing) { activateTab(id); return; }

  syncToActiveTab();
  hideConvStatsPanel();
  const { content } = await api('GET', `/api/file?path=${encodeURIComponent(filePath)}`);
  const tab = { id, type: 'file', filePath, filename, content, modified: false, mode: editorMode };
  openTabs.push(tab);
  activeTabId = id;
  activeFilePath = filePath; activeConvPath = null;
  activeFileContent = content; modified = false;
  renderTabBar();
  renderEditor(filePath, filename, content);
  saveTabState();

  if (currentTab === 'commands') {
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

// ── Render editor ──────────────────────────────────────────────────────────
function renderEditor(filePath, filename, content) {
  const pane = document.getElementById('editor-content');
  pane.innerHTML = '';

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'editor-toolbar';

  const fnEl = document.createElement('div');
  fnEl.className = 'editor-filename';
  fnEl.id = 'editor-filename';
  fnEl.textContent = filePath;

  const blameBtn = document.createElement('button');
  blameBtn.className = 'mode-btn' + (blameGutterVisible ? ' active' : '');
  blameBtn.textContent = 'Blame';
  blameBtn.onclick = () => {
    blameGutterVisible = !blameGutterVisible;
    saveUIState({ blameGutterVisible });
    blameBtn.classList.toggle('active', blameGutterVisible);
    pane.classList.toggle('blame-hidden', !blameGutterVisible);
  };

  toolbar.appendChild(fnEl);
  toolbar.appendChild(blameBtn);
  pane.appendChild(toolbar);
  pane.classList.toggle('blame-hidden', !blameGutterVisible);

  // Git info bar (async — inserts itself when ready)
  const gitBar = document.createElement('div');
  gitBar.className = 'git-info-bar';
  pane.appendChild(gitBar);
  api('GET', `/api/gitinfo?path=${encodeURIComponent(filePath)}`).then(info => {
    if (!info || !gitBar.isConnected) return;
    const ago = relativeTime(new Date(info.timestamp));
    gitBar.innerHTML = `<span class="git-hash">${escHtml(info.hash)}</span><span class="git-subject">${escHtml(info.subject)}</span><span class="git-meta">${escHtml(info.author)} · ${ago}</span>`;
    gitBar.classList.add('loaded');
  }).catch(() => {});

  renderPreview(pane, content, filePath);
}

function setEditorMode(mode, filePath, filename) {
  // If switching away from edit, capture current textarea content
  if (editorMode === 'edit' && mode === 'preview') {
    const ta = document.querySelector('textarea');
    if (ta) activeFileContent = ta.value;
  }
  editorMode = mode;
  renderEditor(filePath, filename, activeFileContent);
}

// ── Preview renderer ───────────────────────────────────────────────────────
function buildFrontmatterBlock(fmContent) {
  const fmBlock = document.createElement('div');
  fmBlock.className = 'md-frontmatter';
  for (const line of fmContent.split('\n')) {
    const idx = line.indexOf(':');
    if (idx === -1) continue;
    const key = line.slice(0, idx).trim();
    const val = line.slice(idx + 1).trim();
    const row = document.createElement('div');
    row.className = 'md-frontmatter-row';
    row.innerHTML = `<span class="md-frontmatter-key">${escHtml(key)}</span><span class="md-frontmatter-val">${escHtml(val)}</span>`;
    fmBlock.appendChild(row);
  }
  return fmBlock;
}

function blameDate(ts) {
  const diff = Date.now() - ts;
  const day = 86400000;
  if (diff < day) return 'today';
  if (diff < 2 * day) return 'yest.';
  if (diff < 7 * day) return `${Math.floor(diff / day)}d`;
  const d = new Date(ts);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return d.getFullYear() === new Date().getFullYear() ? `${mon} ${d.getDate()}` : `${mon} '${String(d.getFullYear()).slice(2)}`;
}

function blameLineCount(raw) {
  const n = (raw.match(/\n/g) || []).length;
  return n + (raw.endsWith('\n') ? 0 : 1);
}

function renderBlameGrid(grid, body, lineOffset, blame) {
  const tokens = marked.lexer(body);
  let line = lineOffset;
  const pairs = [];

  for (const token of tokens) {
    const lc = blameLineCount(token.raw);
    if (token.type === 'space') { line += lc; continue; }

    let latest = 0;
    for (let i = line; i < line + lc && i < blame.length; i++) {
      if (blame[i]?.timestamp > latest) latest = blame[i].timestamp;
    }

    const dateCell = document.createElement('div');
    dateCell.className = 'blame-date-cell';
    if (latest) {
      dateCell.textContent = blameDate(latest);
      dateCell.title = new Date(latest).toLocaleString();
    }

    const contentCell = document.createElement('div');
    contentCell.className = 'blame-content-cell md-preview';
    contentCell.innerHTML = marked.parse(token.raw);

    pairs.push([dateCell, contentCell]);
    line += lc;
  }

  if (pairs.length) {
    pairs[0][0].classList.add('first-cell');
    pairs[0][1].classList.add('first-cell');
    pairs[pairs.length - 1][0].classList.add('last-cell');
    pairs[pairs.length - 1][1].classList.add('last-cell');
  }
  for (const [d, c] of pairs) { grid.appendChild(d); grid.appendChild(c); }
}

function renderPreview(pane, content, filePath) {
  const scroll = document.createElement('div');
  scroll.className = 'md-preview-scroll';
  const div = document.createElement('div');
  div.className = 'md-preview';

  const fmMatch = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  const body = fmMatch ? fmMatch[2] : content;
  const fmLineCount = fmMatch ? fmMatch[1].split('\n').length + 2 : 0;

  if (fmMatch) {
    div.appendChild(buildFrontmatterBlock(fmMatch[1]));
    div.insertAdjacentHTML('beforeend', marked.parse(body));
  } else {
    div.innerHTML = marked.parse(content);
  }

  scroll.appendChild(div);
  pane.appendChild(scroll);

  if (!filePath) return;
  api('GET', `/api/blame?path=${encodeURIComponent(filePath)}`).then(blame => {
    if (!blame || !scroll.isConnected) return;
    // Replace card wrapper with gutter-left layout directly in scroll
    scroll.innerHTML = '';
    if (fmMatch) scroll.appendChild(buildFrontmatterBlock(fmMatch[1]));
    const grid = document.createElement('div');
    grid.className = 'blame-grid';
    renderBlameGrid(grid, body, fmLineCount, blame);
    scroll.appendChild(grid);
  }).catch(() => {});
}

// ── Textarea editor ────────────────────────────────────────────────────────
function renderTextarea(pane, content) {
  const ta = document.createElement('textarea');
  ta.value = content;
  ta.spellcheck = false;
  ta.oninput = () => {
    modified = true;
    activeFileContent = ta.value;
    const tab = getActiveTab();
    if (tab) { tab.content = ta.value; tab.modified = true; }
    document.getElementById('editor-filename').classList.add('modified');
    renderTabBar();
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveFile, 2000);
  };
  ta.onkeydown = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      saveFile();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  };
  pane.appendChild(ta);
  ta.focus();
}

// ── Save ───────────────────────────────────────────────────────────────────
async function saveFile() {
  if (!activeFilePath) return;
  clearTimeout(saveTimeout);
  // Capture latest textarea value if in edit mode
  const ta = document.querySelector('textarea');
  if (ta) activeFileContent = ta.value;
  await api('PUT', '/api/file', { filePath: activeFilePath, content: activeFileContent });
  modified = false;
  const tab = getActiveTab();
  if (tab) { tab.modified = false; tab.content = activeFileContent; }
  document.getElementById('editor-filename')?.classList.remove('modified');
  renderTabBar();

  if (currentTab === 'memory' && activeProjectId) {
    await selectProject(activeProjectId);
    projects = await api('GET', '/api/projects');
    renderProjects();
  } else if (currentTab === 'commands') {
    commands = await api('GET', '/api/commands');
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

// ── Delete ─────────────────────────────────────────────────────────────────
async function deleteFile(filePath) {
  if (!confirm(`Delete ${filePath.split('/').pop()}?`)) return;
  await api('DELETE', '/api/file', { filePath });
  const deletedId = tabIdFor('file', filePath);
  const deletedTab = openTabs.find(t => t.id === deletedId);
  if (deletedTab) { deletedTab.modified = false; closeTab(deletedId); }

  if (currentTab === 'memory' && activeProjectId) {
    await selectProject(activeProjectId);
  } else if (currentTab === 'commands') {
    commands = await api('GET', '/api/commands');
    renderCommandsMiddlePanel();
    renderCommandSidebar();
  }
}

  if (e.target === e.currentTarget) document.getElementById('new-command-modal').style.display = 'none';
};

// ── Search ─────────────────────────────────────────────────────────────────
let searchDebounce = null;
const searchInput = document.getElementById('search-input');
const typeFilter = document.getElementById('type-filter');

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(doSearch, 200);
});
typeFilter.addEventListener('change', doSearch);

async function doSearch() {
  const q = searchInput.value.trim();
  const type = typeFilter.value;
  const overlay = document.getElementById('search-results');
  if (!q) { overlay.style.display = 'none'; return; }

  const results = await api('GET', `/api/search?q=${encodeURIComponent(q)}&type=${type}`);
  overlay.style.display = 'block';
  overlay.innerHTML = results.length === 0
    ? '<div style="padding:16px;color:var(--muted);font-size:13px">No results</div>'
    : results.map(r => `
      <div class="search-result-item" onclick="jumpToResult('${escAttr(r.filePath)}','${escAttr(r.filename)}','${escAttr(r.projectId)}')">
        <div class="sr-top">
          <span class="type-badge type-${r.type}">${r.type}</span>
          <span class="sr-name">${escHtml(r.name)}</span>
          <span class="sr-project">${escHtml(r.projectLabel)}</span>
        </div>
        <div class="sr-snippet">${escHtml(r.snippet)}</div>
      </div>
    `).join('');
}

async function jumpToResult(filePath, filename, projectId) {
  document.getElementById('search-results').style.display = 'none';
  searchInput.value = '';
  if (activeProjectId !== projectId) {
    switchTab('memory');
    await selectProject(projectId);
  }
  await openFile(filePath, filename);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('search-results').style.display = 'none';
    searchInput.value = '';
  }
});

// ── SSE ────────────────────────────────────────────────────────────────────
function setupSSE() {
  const es = new EventSource('/api/events');
  const dot = document.getElementById('status-dot');
  es.onopen = () => { dot.style.background = 'var(--ok)'; dot.title = 'Live sync active'; };
  es.onerror = () => { dot.style.background = 'var(--err)'; dot.title = 'Connection lost'; };
  es.onmessage = async (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'change') {
      if (currentTab === 'memory' && activeProjectId) {
        await selectProject(activeProjectId);
        projects = await api('GET', '/api/projects');
        renderProjects();
      } else if (currentTab === 'commands') {
        commands = await api('GET', '/api/commands');
        renderCommandsMiddlePanel();
        renderCommandSidebar();
      }
    }
  };
}


// ── Conversation viewer ────────────────────────────────────────────────────
async function openConversation(conv) {
  const id = tabIdFor('conv', conv.filePath);
  const existing = openTabs.find(t => t.id === id);
  if (existing) { activateTab(id); return; }

  syncToActiveTab();
  const ec = document.getElementById('editor-content');
  ec.innerHTML = `<div class="empty">${ICON_FILE}Loading…</div>`;

  const messages = await api('GET', `/api/conversation?path=${encodeURIComponent(conv.filePath)}`);
  const tab = { id, type: 'conv', filePath: conv.filePath, filename: conv.id, conv, messages };
  openTabs.push(tab);
  activeTabId = id;
  activeConvPath = conv.filePath; activeFilePath = null; modified = false;
  renderTabBar();
  renderChatView(ec, conv, messages);
  saveTabState();
}

function renderChatView(pane, conv, messages) {
  pane.innerHTML = '';

  const toolbar = document.createElement('div');
  toolbar.className = 'editor-toolbar';
  const userTurns = messages.filter(m => m.type === 'user' && !m.isMeta).length;
  toolbar.innerHTML = `
    <div class="editor-filename">${escHtml(conv.filePath)}</div>
    <span style="font-size:11px;color:var(--muted)">${userTurns} turns · ${escHtml(conv.model || '')}</span>
    <button class="stats-toggle-btn${statsPanelOpen ? ' active' : ''}" id="stats-toggle-btn">Cost & Tokens</button>
  `;
  pane.appendChild(toolbar);

  toolbar.querySelector('#stats-toggle-btn').addEventListener('click', () => {
    statsPanelOpen = !statsPanelOpen;
    toolbar.querySelector('#stats-toggle-btn').classList.toggle('active', statsPanelOpen);
    if (statsPanelOpen) showConvStatsPanel(messages, conv);
    else hideConvStatsPanel();
  });

  const scroll = document.createElement('div');
  scroll.className = 'chat-scroll';
  renderChatMessages(scroll, messages);
  pane.appendChild(scroll);
  scroll.scrollTop = scroll.scrollHeight;

  if (statsPanelOpen) showConvStatsPanel(messages, conv);
  else hideConvStatsPanel();
}

function renderChatMessages(scroll, messages) {
  for (const record of messages) {
    const isUser = record.type === 'user';
    const turn = document.createElement('div');
    turn.className = 'chat-turn';

    const roleEl = document.createElement('div');
    roleEl.className = 'chat-role';
    roleEl.textContent = isUser ? 'You' : 'Claude';
    turn.appendChild(roleEl);

    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${isUser ? 'chat-bubble-user' : 'chat-bubble-assistant'}`;

    const content = record.message?.content;
    if (typeof content === 'string') {
      bubble.innerHTML = isUser ? `<p>${escHtml(content)}</p>` : marked.parse(content);
    } else if (Array.isArray(content)) {
      for (const block of content) {
        if (block.type === 'text') {
          const d = document.createElement('div');
          d.className = 'md-preview';
          d.innerHTML = marked.parse(block.text || '');
          bubble.appendChild(d);
        } else if (block.type === 'tool_use') {
          const t = document.createElement('div');
          t.className = 'chat-tool';
          t.textContent = `⚙ ${block.name}`;
          t.title = JSON.stringify(block.input || {}, null, 2);
          bubble.appendChild(t);
        } else if (block.type === 'tool_result') {
          // skip
        }
      }
    }

    if (!bubble.innerHTML.trim()) continue;
    turn.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'chat-meta';
    meta.textContent = record.timestamp ? new Date(record.timestamp).toLocaleString() : '';
    turn.appendChild(meta);

    scroll.appendChild(turn);
  }
}


// ── Init ───────────────────────────────────────────────────────────────────
boot();

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  projects = await api('GET', '/api/projects');
  renderProjects();
  if (activeProjectId) selectProject(activeProjectId);
});
</script>
